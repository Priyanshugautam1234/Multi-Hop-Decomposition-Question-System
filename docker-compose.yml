version: '3.8'

services:
  # FastAPI Production Engine
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihop-api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Streamlit Interactive Visualizer & DAG Explorer
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihop-ui
    command: streamlit run src/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped
